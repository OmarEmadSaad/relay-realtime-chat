# Render Blueprint: one free web service runs the API, Socket.IO and the client.
# Render reads this file when you create a Blueprint from the repository.
services:
  - type: web
    name: relay-realtime-chat
    runtime: node
    plan: free
    region: frankfurt
    # --include=dev: TypeScript (a dev dependency) compiles the browser client
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Asked for when the Blueprint is created (never stored in the repo)
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: RealtimeChat
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 10m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Render sits in front as a proxy: per-IP rate limits need the real client IP
      - key: TRUST_PROXY
        value: "1"
      # mongodb-memory-server (tests only) would otherwise download MongoDB on install
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
